<!DOCTYPE html>
<html lang="en">
<head>
  <title>Cricket Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Bat Ball Stump Game</h1>

  <button class="choice-button" onclick="
    let computerChoice = generateComputerChoice();
    let resultMsg = getResult('Bat', computerChoice);
    showResult('Bat', computerChoice, resultMsg);
  ">
  <img src="bat.png" alt="Bat Image" class="choice-image">
  </button>

  <button class="choice-button" onclick="
    computerChoice = generateComputerChoice();
    resultMsg = getResult('Ball', computerChoice);
    showResult('Ball', computerChoice, resultMsg);
  ">
  <img src="ball.png" alt="Ball Image" class="choice-image">
  </button>

  <button class="choice-button" onclick="
    computerChoice = generateComputerChoice();
    resultMsg = getResult('Stump', computerChoice);
    showResult('Stump', computerChoice, resultMsg);
  ">
  <img src="stump.png" alt="Stump Image" class="choice-image">
  </button>

  <h3 id="user-move"></h3>
  <h3 id="computer-move"></h3>
  <h3 id="result"></h3>
  <h3 id="score"></h3>

  <br>
  <button onclick="resetScore()">Reset Score</button>

  <script>
    let score = JSON.parse(localStorage.getItem('score')) || {
      Win: 0,
      Loss: 0,
      Tie: 0,
    };

    function saveScore() {
      localStorage.setItem('score', JSON.stringify(score));
    }

    function resetScore() {
      score = { Win: 0, Loss: 0, Tie: 0 };
      localStorage.removeItem('score');
      showResult('', '', '');
    }

    function generateComputerChoice() {
      let randomNumber = Math.random() * 3;
      if (randomNumber > 0 && randomNumber <= 1) {
        return 'Bat';
      } else if (randomNumber > 1 && randomNumber <= 2) {
        return 'Ball';
      } else {
        return 'Stump';
      }
    }

    function getResult(userMove, computerMove) {
      if (userMove === 'Bat') {
        if (computerMove === 'Ball') {
          score.Win++;
          saveScore();
          return 'User won.';
        } else if (computerMove === 'Bat') {
          score.Tie++;
          saveScore();
          return `It's a tie`;
        } else {
          score.Loss++;
          saveScore();
          return 'Computer has won';
        }
      } else if (userMove === 'Ball') {
        if (computerMove === 'Ball') {
          score.Tie++;
          saveScore();
          return `It's a tie`;
        } else if (computerMove === 'Bat') {
          score.Loss++;
          saveScore();
          return 'Computer has won';
        } else {
          score.Win++;
          saveScore();
          return 'User won.';
        }
      } else {
        if (computerMove === 'Ball') {
          score.Loss++;
          saveScore();
          return 'Computer has won';
        } else if (computerMove === 'Bat') {
          score.Win++;
          saveScore();
          return 'User won.';
        } else {
          score.Tie++;
          saveScore();
          return `It's a tie`;
        }
      }
    }

    function showResult(userMove, computerMove, result) {
      document.getElementById('user-move').innerText = userMove ? `You have chosen ${userMove}` : '';
      document.getElementById('computer-move').innerText = computerMove ? `Computer choice is ${computerMove}` : '';
      document.getElementById('result').innerText = result || '';
      document.getElementById('score').innerText = `Won: ${score.Win}, Loss: ${score.Loss}, Tie: ${score.Tie}`;
    }
  </script>
</body>
</html>
